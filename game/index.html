<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allods 2 — rework web</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  #host { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; flex:none; width:1024px; height:768px; transform-origin:center center; }
  #frame canvas { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; outline:none; }
  #overlay { position:absolute; inset:0; pointer-events:none; }
  #overlay > * { pointer-events:auto; }
</style>
</head>
<body>
<div id="host"><div id="frame"><div id="overlay"></div></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
